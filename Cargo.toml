[workspace]
members = [
	"app",
  "kernel",
	"extensions",
	"macros"
]
resolver = "3"

[workspace.package]
version = "1.2.0-rc1"
repository = "https://codeberg.org/nullclyze/salarixi"
authors = ["nullclyze"]
edition = "2021"

[profile.release]
opt-level = 3
strip = true
lto = "thin"

[workspace.dependencies]
salarixi-kernel = { path = "kernel" }
salarixi-extensions = { path = "extensions" }
salarixi-macros = { path = "macros" }
tauri = { version = "2.11.0", features = [] }
memory-stats = "1.0.0"
open = "5.3.3"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
discord-presence = "3.2.0"
systemstat = "0.2.7"
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
azalea = { version = "0.15.1", default-features = false, features = ["packet-event"] }
socks5-impl = { version = "0.8.0", features = ["client"] }
reqwest = { version = "0.13.1", features = ["json"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
aes-gcm = "0.10"
regex = "1"
once_cell = "1.18"
base64 = "0.22.1"
image = "0.25"
dashmap = "6.1.0"
md-5 = "0.11.0"
rhai = "1.24.0"
dns-lookup = "3.0.1"
hashbrown = "0.16.1"
dirs = "6.0.0"
bytes = "1.12.1"
pkcs8 = "=0.11.0-rc.11"
proc-macro2 = "1.0.107"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
