name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-22

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-latest
            name: windows-x64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust nightly
        run: rustup toolchain install nightly-2026-07-22 --profile minimal

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build

      - name: Collect bundles (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundles | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe bundles -ErrorAction SilentlyContinue
          Copy-Item target\release\bundle\msi\*.msi bundles -ErrorAction SilentlyContinue

      - name: Collect bundles (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p bundles
          cp target/release/bundle/deb/*.deb bundles/ 2>/dev/null || true
          cp target/release/bundle/rpm/*.rpm bundles/ 2>/dev/null || true
          cp target/release/bundle/appimage/*.AppImage bundles/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: salarixi-${{ matrix.name }}
          path: bundles/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/*
          generate_release_notes: true
